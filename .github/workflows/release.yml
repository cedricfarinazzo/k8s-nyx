name: Release

# Automated release pipeline. semantic-release computes the next version from
# the Conventional Commits merged to master, creates the GitHub Release + tag +
# changelog, and hands that exact version to the image and chart publish jobs in
# the SAME run. (A tag created here with GITHUB_TOKEN would not trigger a
# separate tag-driven workflow, so the publish jobs run as dependents instead.)
#
# Gated on CI: this runs only after the CI workflow completes on master, and the
# release job runs only when that CI run succeeded — so build/test/lint validate
# the commit before anything is released or published.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

# semantic-release needs contents/issues/pull-requests:write; the publish jobs
# need packages:write for GHCR.
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  IMAGE: ghcr.io/cedricfarinazzo/k8s-nyx

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Only release when the CI run that triggered this succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      published: ${{ steps.semantic.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Check out the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm clean-install
      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AC3: publish at the exact version semantic-release computed (no drift).
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true

  publish-chart:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # AC2/AC3: Chart.version / appVersion aligned to the released version,
      # pushed to oci://ghcr.io/cedricfarinazzo/k8s-nyx-chart.
      - name: Package chart at released version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          echo "Packaging chart version $VERSION"
          helm package charts/k8s-nyx-chart \
            --version "$VERSION" --app-version "$VERSION" -d dist

      - name: Push chart to GHCR
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          helm push "dist/k8s-nyx-chart-${VERSION}.tgz" \
            oci://ghcr.io/cedricfarinazzo
