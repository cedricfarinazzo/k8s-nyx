name: Release

# Build and publish the operator image on a version tag. Version computation and
# release creation are handled by the semantic-release flow (a separate story);
# this workflow consumes the tag and publishes the multi-arch image to GHCR.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cedricfarinazzo/k8s-nyx

jobs:
  build-image:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  publish-chart:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # AC2: Chart.version / appVersion aligned to the released tag, pushed to
      # oci://ghcr.io/cedricfarinazzo/k8s-nyx-chart.
      - name: Package chart at released version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging chart version $VERSION"
          helm package charts/k8s-nyx-chart \
            --version "$VERSION" --app-version "$VERSION" -d dist

      - name: Push chart to GHCR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm push "dist/k8s-nyx-chart-${VERSION}.tgz" \
            oci://ghcr.io/cedricfarinazzo
