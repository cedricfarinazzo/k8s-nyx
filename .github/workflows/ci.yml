name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # wagoid reads the PR's commits via the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint PR commits (Conventional Commits)
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate manifests and deepcopy
        run: make manifests generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false

  helm:
    name: Helm lint/template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint charts/k8s-nyx-chart
      - name: helm template (default + webhook-enabled)
        run: |
          helm template nyx charts/k8s-nyx-chart -n nyx-system > /tmp/default.yaml
          helm template nyx charts/k8s-nyx-chart -n nyx-system --set webhook.enabled=true > /tmp/webhook.yaml
          # AC1: chart bundles CRD, RBAC, and the operator Deployment.
          for kind in CustomResourceDefinition ClusterRole ClusterRoleBinding Deployment ServiceAccount; do
            grep -q "^kind: $kind$" /tmp/default.yaml || { echo "missing $kind in default render"; exit 1; }
          done
          grep -q "ValidatingWebhookConfiguration" /tmp/webhook.yaml || { echo "webhook not rendered when enabled"; exit 1; }
      - name: Version alignment (AC2 wiring)
        run: |
          # Packaging with a version sets Chart.version, appVersion, and the
          # operator image tag together — the same wiring release.yml uses.
          helm package charts/k8s-nyx-chart --version 9.9.9 --app-version 9.9.9 -d /tmp/pkg
          helm show chart /tmp/pkg/k8s-nyx-chart-9.9.9.tgz | grep -qx 'version: 9.9.9'
          helm show chart /tmp/pkg/k8s-nyx-chart-9.9.9.tgz | grep -qx 'appVersion: 9.9.9'
          helm template nyx /tmp/pkg/k8s-nyx-chart-9.9.9.tgz | grep -q 'k8s-nyx:9.9.9'

  e2e:
    name: E2E (kind)
    runs-on: ubuntu-latest
    # The suite waits out real ~5–7 min sleep/wake windows; bound the whole job.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: nyx-ci
      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: k8s-nyx:ci
      - name: Load image into kind
        run: kind load docker-image k8s-nyx:ci --name nyx-ci
      # AC1/AC3: helm install on a fresh cluster, operator becomes Ready.
      - name: helm install
        run: |
          helm install nyx charts/k8s-nyx-chart \
            --namespace nyx-system --create-namespace \
            --set image.repository=k8s-nyx \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait --timeout 5m
      - name: Assert operator Ready
        run: |
          kubectl -n nyx-system rollout status deploy/nyx-k8s-nyx-chart --timeout=2m
          kubectl -n nyx-system wait --for=condition=Available deploy/nyx-k8s-nyx-chart --timeout=2m
          kubectl get crd sleepschedules.nyx.dev
      - name: helm test (smoke)
        run: helm test nyx --namespace nyx-system --timeout 2m
      # AC1/AC3: the behavioural suite — sleep/wake/restore across every kind,
      # multi-namespace, kind targeting, PVC-deletion guard, temporary-wake override.
      - name: e2e suite
        run: make test-e2e
