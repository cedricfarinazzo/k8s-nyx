name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the base..head commit range is available
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install commitlint
        run: bun add -d @commitlint/cli @commitlint/config-conventional
      - name: Lint PR commits (Conventional Commits)
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate manifests and deepcopy
        run: make manifests generate
      # `make lint` builds golangci-lint from source with the project's Go
      # toolchain (GOTOOLCHAIN). The prebuilt golangci-lint binary / action is
      # built with an older Go and refuses to lint our newer Go target, so we
      # can't use golangci/golangci-lint-action here.
      - name: golangci-lint
        run: make lint

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false

  helm:
    name: Helm lint/template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0
      - name: helm lint
        run: helm lint charts/k8s-nyx-chart
      - name: helm template (default + webhook-enabled)
        run: |
          helm template nyx charts/k8s-nyx-chart -n nyx-system > /tmp/default.yaml
          helm template nyx charts/k8s-nyx-chart -n nyx-system --set webhook.enabled=true > /tmp/webhook.yaml
          # AC1: chart bundles CRD, RBAC, the operator Deployment, and the metrics Service.
          for kind in CustomResourceDefinition ClusterRole ClusterRoleBinding Deployment ServiceAccount Service; do
            grep -q "^kind: $kind$" /tmp/default.yaml || { echo "missing $kind in default render"; exit 1; }
          done
          grep -q "ValidatingWebhookConfiguration" /tmp/webhook.yaml || { echo "webhook not rendered when enabled"; exit 1; }
      - name: Version alignment (AC2 wiring)
        run: |
          # Packaging with a version sets Chart.version, appVersion, and the
          # operator image tag together — the same wiring release.yml uses.
          helm package charts/k8s-nyx-chart --version 9.9.9 --app-version 9.9.9 -d /tmp/pkg
          helm show chart /tmp/pkg/k8s-nyx-chart-9.9.9.tgz | grep -qx 'version: 9.9.9'
          helm show chart /tmp/pkg/k8s-nyx-chart-9.9.9.tgz | grep -qx 'appVersion: 9.9.9'
          helm template nyx /tmp/pkg/k8s-nyx-chart-9.9.9.tgz | grep -q 'k8s-nyx:9.9.9'

  e2e:
    name: E2E (kind)
    runs-on: ubuntu-latest
    # The suite waits out real ~5–7 min sleep/wake windows; bound the whole job.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: nyx-ci
      - name: Build operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: k8s-nyx:ci
      - name: Load image into kind
        run: kind load docker-image k8s-nyx:ci --name nyx-ci
      # AC1/AC3: helm install on a fresh cluster, operator becomes Ready.
      - name: helm install
        run: |
          helm install nyx charts/k8s-nyx-chart \
            --namespace nyx-system --create-namespace \
            --set image.repository=k8s-nyx \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait --timeout 5m
      - name: Assert operator Ready
        run: |
          kubectl -n nyx-system rollout status deploy/nyx-k8s-nyx-chart --timeout=2m
          kubectl -n nyx-system wait --for=condition=Available deploy/nyx-k8s-nyx-chart --timeout=2m
          kubectl get crd sleepschedules.nyx.dev
      - name: helm test (smoke)
        run: helm test nyx --namespace nyx-system --timeout 2m
      # AC1/AC3: the behavioural suite — sleep/wake/restore across every kind,
      # multi-namespace, kind targeting, PVC-deletion guard, temporary-wake override.
      - name: e2e suite
        run: make test-e2e
      # Dump the operator's logs whatever the suite's outcome — on failure this
      # is the primary forensic trail (what the reconciler actually did); on
      # success it's a record of the sleep/wake/restore actions taken.
      - name: Operator logs
        if: always()
        run: kubectl -n nyx-system logs deploy/nyx-k8s-nyx-chart --tail=-1 --prefix=true
