apiVersion: v1
kind: Pod
metadata:
  name: {{ include "k8s-nyx.fullname" . }}-test-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-nyx.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "k8s-nyx.serviceAccountName" . }}
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    # rancher/kubectl declares a *named* user, which kubelet cannot verify against
    # runAsNonRoot — pin an explicit non-root uid/gid so the test pod admits.
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: api-check
    image: rancher/kubectl:v1.31.0
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    # Proves the chart's RBAC + the installed CRD work end to end: the operator
    # ServiceAccount can list the SleepSchedule custom resource via the API.
    command:
    - kubectl
    - get
    - sleepschedules.nyx.dev
    - --all-namespaces
