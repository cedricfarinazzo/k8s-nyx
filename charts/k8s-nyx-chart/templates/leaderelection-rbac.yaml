{{- if .Values.leaderElection.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-nyx.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-nyx.labels" . | nindent 4 }}
rules:
# Leader election uses the coordination.k8s.io Lease lock (controller-runtime
# default); no ConfigMap lock, so no configmaps grant here (VC-159).
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-nyx.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-nyx.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-nyx.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-nyx.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
