apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-nyx.fullname" . }}-manager
  labels:
    {{- include "k8s-nyx.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-nyx.fullname" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-nyx.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
