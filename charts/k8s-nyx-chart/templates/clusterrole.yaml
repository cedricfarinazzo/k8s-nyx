apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-nyx.fullname" . }}-manager
  labels:
    {{- include "k8s-nyx.labels" . | nindent 4 }}
# Least-privilege RBAC: mirrors the controller-gen output in
# config/rbac/role.yaml. Each verb is one the controller exercises; list+watch are
# kept for the informer cache. Rationale per rule: docs/operator-guide.md.
rules:
# Wake ConfigMaps: get/create/update the per-schedule override map (owner-ref GC'd,
# never operator-deleted or patched).
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - update
  - watch
# Events: emitted on workloads/SleepSchedules in any namespace (cluster-wide).
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Checkpoint Secrets: exact-restore store (no patch).
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
# Workloads: list/watch to resolve+cache targets, patch /spec only (no update).
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
  - patch
  - watch
# SleepSchedule: read-only watch/get; status via the /status subresource only.
- apiGroups:
  - nyx.dev
  resources:
  - sleepschedules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nyx.dev
  resources:
  - sleepschedules/status
  verbs:
  - get
  - update
