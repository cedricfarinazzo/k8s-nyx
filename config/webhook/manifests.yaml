---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-nyx-dev-v1alpha1-sleepschedule
  failurePolicy: Fail
  name: vsleepschedule-v1alpha1.kb.io
  rules:
  - apiGroups:
    - nyx.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - sleepschedules
  sideEffects: None
